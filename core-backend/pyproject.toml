[project]
name = "platform-core-backend"
version = "0.1.0"
description = "Núcleo Compartilhado da Engineering Platform (backend) — bootstrap, autenticação delegada, segurança transversal e observabilidade, consumidos como dependência por qualquer aplicação derivada da plataforma."
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "import-linter>=2.13",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "types-python-jose>=3.5.0.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# TEST-001, Seção 4 — piso obrigatório do projeto como um todo (75%). Os
# pisos por camada (Domain 90%, Application 80%, Presentation 70%) não são
# aplicados automaticamente aqui.
fail_under = 75

[tool.mypy]
mypy_path = "src"

[tool.ruff.lint]
# B008: Depends(...) em default de argumento é o padrão idiomático do
# FastAPI (não um bug) — ver presentation/dependencies em modules/auth.
ignore = ["B008"]

# Testes arquiteturais (TEST-001, Seção 8). containers = ["platform_core.modules.*"]
# aplica os contratos abaixo a todo módulo dentro de platform_core/modules/
# automaticamente, incluindo módulos ainda não criados.
[tool.importlinter]
root_packages = ["platform_core"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture por módulo (RA-005, Parte 1.3/1.4)"
type = "layers"
containers = ["platform_core.modules.*"]
layers = [
    "presentation | infrastructure",
    "application",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Domain e Application não importam bibliotecas concretas de infraestrutura (TEST-001, Seção 8)"
type = "forbidden"
source_modules = [
    "platform_core.modules.*.domain",
    "platform_core.modules.*.application",
]
forbidden_modules = [
    "sqlalchemy",
    "asyncpg",
    "redis",
    "httpx",
    "jose",
    "fastapi",
    "starlette",
]

[[tool.importlinter.contracts]]
name = "shared/ não depende de nenhum módulo (RA-005, Seção 65.2)"
type = "forbidden"
source_modules = ["platform_core.shared"]
forbidden_modules = ["platform_core.modules"]

[[tool.importlinter.contracts]]
name = "bootstrap/ é o único Composition Root — não é importado por shared/ ou modules/"
type = "forbidden"
source_modules = ["platform_core.shared", "platform_core.modules"]
forbidden_modules = ["platform_core.bootstrap"]
